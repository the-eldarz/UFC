
name: Build MMA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MMA_Fighting_Godot.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build MMA Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            cmdline-tools;latest
            cmake;3.10.2.4988404
            ndk;23.2.8568313

      - name: Download Godot 4.4.1
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/godot"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -O "$RUNNER_TEMP/godot.zip"

          unzip -q "$RUNNER_TEMP/godot.zip" \
            -d "$RUNNER_TEMP/godot"

          chmod +x "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -e

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz \
            -O "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/templates"

          unzip -q "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"

          cp -r "$RUNNER_TEMP/templates/templates/." \
            "$HOME/.local/share/godot/export_templates/4.4.1.stable/"

      - name: Configure Godot Android settings
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF

          echo "Java: $JAVA_HOME"
          echo "Android SDK: $ANDROID_HOME"

      - name: Prepare project
        shell: bash
        run: |
          set -e

          if [ ! -f "MMA_Fighting_Godot.zip" ]; then
            echo "ERROR: MMA_Fighting_Godot.zip not found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/project"

          unzip -q MMA_Fighting_Godot.zip \
            -d "$RUNNER_TEMP/project"

          PROJECT_FILE=$(find "$RUNNER_TEMP/project" \
            -name project.godot -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found: $PROJECT_DIR"

      - name: Create debug signing key
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -keystore "$HOME/.android/mma-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=MMA Debug,O=MMA,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/mma-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import Godot project
        shell: bash
        run: |
          set -e

          "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" \
            --headless \
            --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Export Android APK
        shell: bash
        run: |
          set -e

          mkdir -p "$RUNNER_TEMP/output"

          "$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" \
            --headless \
            --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$RUNNER_TEMP/output/MMA-Fighting.apk"

          test -s "$RUNNER_TEMP/output/MMA-Fighting.apk"

          echo "APK successfully created"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMA-Fighting-test-APK
          path: ${{ runner.temp }}/output/MMA-Fighting.apk
          if-no-files-found: error
          retention-days: 14
