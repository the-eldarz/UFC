
name: Diagnose MMA Android Project

on:
  workflow_dispatch:
  push:
    paths:
      - 'MMA_Fighting_Godot.zip'
      - '.github/workflows/build.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check archive
        shell: bash
        run: |
          set -e
          test -f MMA_Fighting_Godot.zip
          echo "ZIP archive found"
          unzip -t MMA_Fighting_Godot.zip

      - name: Extract project
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/project"
          unzip -q MMA_Fighting_Godot.zip -d "$GITHUB_WORKSPACE/project"

          PROJECT_FILE=$(find "$GITHUB_WORKSPACE/project" \
            -name project.godot -type f | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: project.godot not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_FILE"

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"

          wget -q \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip \
            -O godot.zip

          unzip -q godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64

          echo "GODOT_BIN=$RUNNER_TEMP/godot/Godot_v4.4.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Inspect project files
        shell: bash
        run: |
          echo "===== PROJECT FILES ====="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

          echo "===== PROJECT.GODOT ====="
          cat "$PROJECT_DIR/project.godot"

          echo "===== EXPORT_PRESETS.CFG ====="
          if [ -f "$PROJECT_DIR/export_presets.cfg" ]; then
            nl -ba "$PROJECT_DIR/export_presets.cfg"
          else
            echo "ERROR: export_presets.cfg not found"
          fi

      - name: Validate Godot project
        shell: bash
        run: |
          set -o pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --verbose \
            --path "$PROJECT_DIR" \
            --quit 2>&1 | tee godot-diagnostic.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mma-diagnostic
          path: |
            godot-diagnostic.log
