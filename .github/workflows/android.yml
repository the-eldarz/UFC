name: Build MMA Fighting Android APK (test)

on:
  push:
    paths:
      - 'MMA_Fighting_Godot.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Godot project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'MMA_Fighting_Godot.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Upload MMA_Fighting_Godot.zip to the repository root."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/unpacked"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/unpacked"
          PROJECT_FILE="$(find "$RUNNER_TEMP/unpacked" -name project.godot -type f -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "project.godot was not found in the ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      - name: Download Godot 4.4.1 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION="4.4.1"
          mkdir -p "$RUNNER_TEMP/godot" "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot/godot.zip"
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot/bin" -type f -name 'Godot_*_linux.x86_64' -print -quit)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          curl -L --fail --retry 3 "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" -o "$RUNNER_TEMP/godot/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot/templates"
          unzip -q "$RUNNER_TEMP/godot/templates.tpz" -d "$RUNNER_TEMP/godot/templates"
          cp -a "$RUNNER_TEMP/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/java_sdk_path = "%s"\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_password = "android"\n' \
            "$JAVA_HOME" "$ANDROID_HOME" "$HOME/.android/debug.keystore" \
            > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Import project and export unsigned-to-user test APK (debug-signed)
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/output"
          "$GODOT_BIN" --headless --path . --editor --quit
          "$GODOT_BIN" --headless --path . --export-debug "Android" "$GITHUB_WORKSPACE/output/MMA-Fighting-test.apk"

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: MMA-Fighting-test-APK
          path: output/MMA-Fighting-test.apk
          if-no-files-found: error
          retention-days: 14
